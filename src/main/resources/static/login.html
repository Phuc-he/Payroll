<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phúc Quân HR - Đăng Nhập Hệ Thống</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f1f5f9;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            text-align: center;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
        }
        .login-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: var(--primary);
            color: white;
            font-size: 1.25rem;
            font-weight: 800;
            border-radius: var(--radius-lg);
            margin-bottom: 1.25rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.35rem;
            letter-spacing: -0.3px;
        }
        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }
        .login-form {
            text-align: left;
        }
        .login-form label {
            display: block;
            margin-bottom: 0.4rem;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
        }
        .login-form input {
            width: 100%;
            margin-bottom: 1.25rem;
            padding: 0.75rem 0.9rem;
            font-size: 0.9rem;
        }
        .login-btn {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }
        .error-message {
            color: var(--danger-text);
            background: var(--danger-light);
            border: 1px solid var(--danger-border);
            padding: 0.65rem 0.85rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.25rem;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-logo">PQ</div>
        <h1 class="login-title">Phúc Quân HR</h1>
        <p class="login-subtitle">Quản lý ca làm việc & tính lương nhân sự</p>
        
        <div id="errorBox" class="error-message">
            Tài khoản hoặc mật khẩu không chính xác!
        </div>

        <form class="login-form" action="/login" method="POST">
            <label for="username">Tên đăng nhập / Mã NV</label>
            <input type="text" id="username" name="username" placeholder="Nhập mã NV (VD: phucnd)" required autofocus>
            
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu..." required>
            
            <button type="submit" class="btn-primary login-btn">Đăng Nhập</button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            document.getElementById('errorBox').style.display = 'block';
        }
    </script>
</body>
</html>
